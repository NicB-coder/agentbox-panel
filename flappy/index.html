<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flappy Bird</title>
<style>
  html, body { margin: 0; height: 100%; background: #222; display: flex; align-items: center; justify-content: center; }
  canvas { background: #70c5ce; max-height: 100vh; max-width: 100vw; touch-action: none; }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const GRAVITY = 0.45, FLAP = -7.5;
const PIPE_W = 60, GAP = 150, PIPE_SPEED = 2.5, PIPE_EVERY = 90; // frames
const GROUND = 80, BIRD_X = 100, BIRD_R = 14;

let bird, pipes, frame, score, best = Number(localStorage.getItem('flappyBest') || 0);
let state = 'ready'; // ready | playing | over

function reset() {
  bird = { y: H / 2, vy: 0 };
  pipes = [];
  frame = 0;
  score = 0;
  state = 'ready';
}

function flap() {
  if (state === 'over') { reset(); return; }
  if (state === 'ready') state = 'playing';
  bird.vy = FLAP;
}

function die() {
  state = 'over';
  if (score > best) { best = score; localStorage.setItem('flappyBest', best); }
}

function update() {
  frame++;
  if (state === 'ready') { bird.y = H / 2 + Math.sin(frame / 10) * 6; return; }
  if (state !== 'playing') return;

  bird.vy += GRAVITY;
  bird.y += bird.vy;

  if (frame % PIPE_EVERY === 0) {
    const top = 60 + Math.random() * (H - GROUND - GAP - 120);
    pipes.push({ x: W, top, scored: false });
  }
  for (const p of pipes) {
    p.x -= PIPE_SPEED;
    if (!p.scored && p.x + PIPE_W < BIRD_X) { p.scored = true; score++; }
    const hitX = BIRD_X + BIRD_R > p.x && BIRD_X - BIRD_R < p.x + PIPE_W;
    if (hitX && (bird.y - BIRD_R < p.top || bird.y + BIRD_R > p.top + GAP)) die();
  }
  pipes = pipes.filter(p => p.x + PIPE_W > 0);

  if (bird.y + BIRD_R > H - GROUND || bird.y - BIRD_R < 0) die();
}

function text(str, x, y, size) {
  ctx.font = `bold ${size}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#000';
  ctx.strokeText(str, x, y);
  ctx.fillStyle = '#fff';
  ctx.fillText(str, x, y);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = '#4caf50';
  for (const p of pipes) {
    ctx.fillRect(p.x, 0, PIPE_W, p.top);
    ctx.fillRect(p.x, p.top + GAP, PIPE_W, H);
    ctx.fillRect(p.x - 4, p.top - 20, PIPE_W + 8, 20);
    ctx.fillRect(p.x - 4, p.top + GAP, PIPE_W + 8, 20);
  }

  ctx.fillStyle = '#ded895';
  ctx.fillRect(0, H - GROUND, W, GROUND);
  ctx.fillStyle = '#8bc34a';
  ctx.fillRect(0, H - GROUND, W, 10);

  // bird tilts with its speed
  ctx.save();
  ctx.translate(BIRD_X, bird.y);
  ctx.rotate(Math.max(-0.5, Math.min(1.2, bird.vy / 10)));
  ctx.fillStyle = '#ffd400';
  ctx.beginPath(); ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(6, -4, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(8, -4, 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff7a00';
  ctx.fillRect(10, 2, 10, 5);
  ctx.restore();

  if (state === 'playing') text(score, W / 2, 80, 48);
  if (state === 'ready') {
    text('Flappy Bird', W / 2, 200, 44);
    text('Click, tap or press Space', W / 2, 400, 20);
  }
  if (state === 'over') {
    text('Game Over', W / 2, 220, 44);
    text('Score: ' + score, W / 2, 270, 28);
    text('Best: ' + best, W / 2, 310, 28);
    text('Click or press Space to retry', W / 2, 400, 20);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) flap(); }
});
canvas.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });

reset();
loop();
</script>
</body>
</html>
